---
- name: Converge
  hosts: all
  pre_tasks:
    - name: Apt update and upgrade
      become: true
      become_user: root
      ansible.builtin.apt:
        upgrade: true
        update_cache: true
    - name: Install git
      become: true
      become_user: root
      ansible.builtin.apt:
        name: git
        state: present
  tasks:
    - name: Run the role
      ansible.builtin.include_role:
        name: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') }}"
