---
- name: Install Node.js Packages
  become: true
  become_user: "{{ dirt_system_user }}"
  community.general.npm:
    global: true
    name: pm2
    executable: "{{ dirt_nvm_npm_path }}"
    version: "{{ dirt_nvm_pm2_version }}"
  environment:
    PATH: "{{ dirt_nvm_node_dir }}/bin:{{ ansible_env.PATH }}"

- name: Delete specific pm2 process
  become: true
  become_user: "{{ dirt_system_user }}"
  ansible.builtin.command: "{{ dirt_nvm_pm2_path }} delete {{ dirt_service_name }}"
  changed_when: true
  failed_when: false
  environment:
    PATH: "{{ dirt_nvm_node_dir }}/bin:{{ ansible_env.PATH }}"
    HOME: "{{ dirt_system_user_home }}"
  notify:
    - "Reload pm2"

- name: Start pm2 app
  become: true
  become_user: "{{ dirt_system_user }}"
  ansible.builtin.command: "{{ dirt_nvm_pm2_path }} start index.js -i 0 -n {{ dirt_service_name }}"
  changed_when: true
  args:
    chdir: "{{ dirt_codebase_path }}"
  environment:
    PATH: "{{ dirt_nvm_node_dir }}/bin:{{ ansible_env.PATH }}"
    HOME: "{{ dirt_system_user_home }}"
  notify:
    - "Reload pm2"

- name: Save the current PM2 running list
  become: true
  become_user: "{{ dirt_system_user }}"
  ansible.builtin.command: "{{ dirt_nvm_pm2_path }} save"
  changed_when: true
  environment:
    PATH: "{{ dirt_nvm_node_dir }}/bin:{{ ansible_env.PATH }}"
    HOME: "{{ dirt_system_user_home }}"
  notify:
    - "Reload pm2"

- name: Delete the old startup file
  become: true
  become_user: "root"
  ansible.builtin.command: "{{ dirt_nvm_pm2_path }} unstartup {{ dirt_init_system }} -u {{ dirt_system_user }}"
  changed_when: true
  environment:
    PATH: "{{ dirt_nvm_node_dir }}/bin:{{ ansible_env.PATH }}"
  failed_when: false
  notify:
    - "Reload pm2"

- name: Stop the pm2 daemon so systemd can own the next one
  become: true
  failed_when: false
  become_user: "{{ dirt_system_user }}"
  ansible.builtin.command: "{{ dirt_nvm_pm2_path }} kill"
  changed_when: true
  environment:
    PATH: "{{ dirt_nvm_node_dir }}/bin:{{ ansible_env.PATH }}"

- name: Generate an PM2 init service file
  become: true
  ansible.builtin.command: >-
    env NODE_NO_WARNINGS=1 {{ dirt_nvm_pm2_path }} startup {{ dirt_init_system }}
    -u {{ dirt_system_user }} --hp {{ dirt_system_user_home }}
  changed_when: true
  environment:
    PATH: "{{ dirt_nvm_node_dir }}/bin:{{ ansible_env.PATH }}"
  notify:
    - "Reload pm2"

- name: Enable the PM2 service
  ansible.builtin.service:
    name: "pm2-{{ dirt_service_name }}"
    enabled: true
